[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rekordbox-manager"
version = "0.3.33"
description = "Local playlist analysis and memory-cue planning for Rekordbox"
requires-python = ">=3.12"
dependencies = [
  "PySide6-Essentials==6.8.3",
  "PySide6-Addons==6.8.3",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "soundfile==0.13.1",
  "psutil==7.2.2",
  "pyrekordbox==0.5.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pyinstaller==6.22.3"]

[project.scripts]
rekordbox-manager = "rekordbox_manager.app:main"

[tool.setuptools.packages.find]
include = ["rekordbox_manager*"]

[tool.setuptools.package-data]
rekordbox_manager = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
